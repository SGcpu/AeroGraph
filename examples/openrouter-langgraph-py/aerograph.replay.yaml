# yaml-language-server: $schema=../../packages/contracts/schemas/aerograph-replay-yaml.schema.json
tools:
  # OpenRouter API calls are cached deterministically during replay & fork (zero cost)
  - match: "https://openrouter.ai/*"
    toolName: "openrouter_chat_completion"
    class: "replay_safe"

  # Real-world tools with live side effects are forced to run live
  - match: "https://api.weatherapi.com/*"
    toolName: "live_weather_lookup"
    class: "must_execute"

  - match: "https://api.stripe.com/*"
    toolName: "stripe_charge"
    class: "must_execute"
