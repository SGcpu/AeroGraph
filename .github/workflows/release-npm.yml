name: Publish NPM Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish Packages to NPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Verify zero schema drift
        run: npm run drift:check

      - name: Publish @aerograph/contracts
        run: npm publish -w @aerograph/contracts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @aerograph/sdk
        run: npm publish -w @aerograph/sdk --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @aerograph/adapter-langchain
        run: npm publish -w @aerograph/adapter-langchain --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @aerograph/otel
        run: npm publish -w @aerograph/otel --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @aerograph/aerorepl (CLI)
        run: npm publish -w @aerograph/aerorepl --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
